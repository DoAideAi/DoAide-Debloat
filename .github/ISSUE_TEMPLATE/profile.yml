name: Package question or profile change
description: "Ask what a package is, or propose a change to an OEM profile or the never-disable list."
title: "[profile] <oem>: <package>"
labels: ["profile"]
body:
  - type: input
    id: package
    attributes:
      label: Package name
      placeholder: "com.samsung.android.app.spage"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "Galaxy A54, One UI 6.1"
  - type: dropdown
    id: ask
    attributes:
      label: What should change
      options:
        - It is missing from the profile and should be disabled by default (say what it is)
        - It should be "ask", not disabled by default (say what it does)
        - It should never be touched (say what broke)
        - I just want to know what it is
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: "What the app does, what broke, or where the package name comes from. The output of `tools/debloat.py lookup <package> --device` helps."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: No serial number, IMEI, phone number, account email or Wi-Fi name in this issue.
          required: true
