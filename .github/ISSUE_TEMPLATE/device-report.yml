name: Device report
description: You ran it on a phone or tablet. Tell the next person with that model what happened.
title: "[device] <brand> <model>, <OS version>"
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Paste what `probe` and `plan` printed; they never print serial numbers. Please keep
        IMEIs, phone numbers, account emails and Wi-Fi names out of this form.
  - type: input
    id: device
    attributes:
      label: Brand and model
      placeholder: "Redmi Note 13 5G (2312DRAABI)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Android version (from probe)
      placeholder: "HyperOS 1.0.4, Android 14"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB cable
        - Wi-Fi (connect --discover)
        - Wi-Fi (manual pair)
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: What `plan` showed
      description: "The WILL DISABLE and ASK THE OWNER lists, as printed."
      render: text
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What `apply` did
      description: "The 'Done: N disabled, M failed' line and any 'Failed (left as they were)' entries, with the exact refusal text."
      render: text
    validations:
      required: true
  - type: textarea
    id: kept
    attributes:
      label: Anything you kept, removed with --remove, or that broke
      description: "e.g. kept Galaxy Store for Wallet; removed Mi Video; nothing broke after a reboot and a day"
  - type: dropdown
    id: restore
    attributes:
      label: Did you test restore?
      options:
        - "Yes, restore --record re-enabled everything"
        - "Not tested"
        - "Tried and it failed (say what below)"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no serial number, IMEI, phone number, account email or Wi-Fi name.
          required: true
